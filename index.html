<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survivor 50 Fantasy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #0b1220;
      color: white;
      font-family: Arial;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .error {
      color: #ff6b6b;
      text-align: center;
      margin-top: 20px;
    }
    .player {
      display: inline-block;
      width: 150px;
      margin: 10px;
      text-align: center;
    }
    img {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<h1>Survivor 50 Fantasy</h1>
<div id="players"></div>
<div id="error" class="error"></div>

<script>
const SHEET_ID = "11hYsbm_26BdMWH3iol6EqQoZv7fvldKVxxkH7XIq7Hc";

async function fetchSheet(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=out:json`;
  const res = await fetch(url);
  const text = await res.text();

  const json = JSON.parse(text.substring(text.indexOf("{"), text.lastIndexOf("}") + 1));

  const cols = json.table.cols.map(c => c.label);
  const rows = json.table.rows;

  return rows.map(r => {
    let obj = {};
    r.c.forEach((c, i) => {
      obj[cols[i]] = c ? c.v : "";
    });
    return obj;
  });
}

async function loadPlayers() {
  try {
    const players = await fetchSheet("Players");

    const container = document.getElementById("players");
    container.innerHTML = "";

    players.forEach(p => {
      const div = document.createElement("div");
      div.className = "player";

      const img = document.createElement("img");
      img.src = `images/${p.Name}.jpg`;

      const name = document.createElement("div");
      name.textContent = p.Name;

      div.appendChild(img);
      div.appendChild(name);

      container.appendChild(div);
    });

  } catch (err) {
    document.getElementById("error").textContent = err.message;
  }
}

loadPlayers();
</script>

</body>
</html>
