<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Survivor 50 Fantasy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      background: #07142a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 56px;
    }

    #players {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 22px;
      align-items: start;
    }

    .player {
      text-align: center;
    }

    .player img {
      width: 140px;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #b5852f;
      background: #0d1b36;
      display: block;
      margin: 0 auto 10px;
    }

    .name {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }

    .error {
      color: #ff7b7b;
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <h1>Survivor 50 Fantasy</h1>
  <div id="players"></div>
  <div id="error" class="error"></div>

  <script>
    const SHEET_ID = "11hYsbm_26BdMWH3iol6EqQoZv7fvldKVxxkH7XIq7Hc";

    async function fetchSheet(sheetName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=out:json`;
      const res = await fetch(url);
      const text = await res.text();

      const start = text.indexOf("{");
      const end = text.lastIndexOf("}");
      const json = JSON.parse(text.slice(start, end + 1));

      const cols = json.table.cols.map(c => c.label || c.id || "");
      const rows = json.table.rows || [];

      return rows.map(r => {
        const obj = {};
        cols.forEach((col, i) => {
          obj[col] = r.c && r.c[i] ? r.c[i].v : "";
        });
        return obj;
      });
    }

    function normalizeFileName(name) {
      return String(name || "")
        .replace(/[\\/:*?"<>|]/g, "")
        .trim();
    }

    function makePlayerCard(playerName) {
      const div = document.createElement("div");
      div.className = "player";

      const img = document.createElement("img");
      const safeName = normalizeFileName(playerName);

      img.src = `images/${safeName}.jpg`;
      img.onerror = function () {
        if (!this.dataset.triedPng) {
          this.dataset.triedPng = "1";
          this.src = `images/${safeName}.png`;
        } else {
          this.style.display = "none";
        }
      };

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = playerName || "Unknown Player";

      div.appendChild(img);
      div.appendChild(name);

      return div;
    }

    async function loadPlayers() {
      try {
        const players = await fetchSheet("Players");
        const container = document.getElementById("players");
        container.innerHTML = "";

        players.forEach(row => {
          const playerName = row.Player || row.Name || "";
          if (!playerName) return;
          container.appendChild(makePlayerCard(playerName));
        });
      } catch (err) {
        document.getElementById("error").textContent = "Error loading players: " + err.message;
      }
    }

    loadPlayers();
  </script>
</body>
</html>
